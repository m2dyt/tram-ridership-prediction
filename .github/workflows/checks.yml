name: Application checks
on: [push, pull_request]
jobs:
  tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.11-bookworm
        env:
          POSTGRES_USER: tram
          POSTGRES_PASSWORD: tram-test-only
          POSTGRES_DB: tram_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U tram -d tram_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      TRAM_TEST_DATABASE_URL: postgresql+psycopg://tram:tram-test-only@127.0.0.1:5432/tram_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt -e .
      - run: python -m pip check
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - run: python -m pytest -q
      - run: python scripts/check_docs.py
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run test
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: npm run format:check
        working-directory: frontend
