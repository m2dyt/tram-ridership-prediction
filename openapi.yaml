          - type: 'null'
        value_kind:
          type: string
          enum:
          - observed
          - estimated
        estimation_method:
          anyOf:
          - type: string
          - type: 'null'
        quality:
          $ref: '#/components/schemas/Quality'
      description: Значение за [interval_start, interval_end). Если value=null, missing_reason заполнена. Для
        estimated estimation_method обязателен и не null; пропуск наблюдения сохраняет выбранный value_kind.
      allOf:
      - if:
          properties:
            value:
              type: 'null'
        then:
          properties:
            missing_reason:
              type: string
              minLength: 1
        else:
          properties:
            missing_reason:
              type: 'null'
      - if:
          properties:
            value_kind:
              const: estimated
        then:
          properties:
            estimation_method:
              type: string
              minLength: 1
        else:
          properties:
            estimation_method:
              type: 'null'
    ObservationPage:
      type: object
      additionalProperties: false
