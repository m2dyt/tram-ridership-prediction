      - spatial
      - interval_start
      - interval_end
      - actual
      - actual_kind
      - model
      - seasonal_naive
      - regression
      - prediction_interval
      - is_peak
      - scored
      - exclusion_reason
      - quality
      properties:
        fold_id:
          type: string
          minLength: 1
          maxLength: 128
        spatial:
          $ref: '#/components/schemas/SpatialKey'
        interval_start:
          type: string
          format: date-time
        interval_end:
          type: string
          format: date-time
        actual:
          anyOf:
          - type: number
            minimum: 0
          - type: 'null'
        actual_kind:
          type: string
          enum:
          - observed
          - estimated
        model:
          anyOf:
          - type: number
            minimum: 0
          - type: 'null'
        seasonal_naive:
          anyOf:
          - type: number
            minimum: 0
          - type: 'null'
        regression:
          anyOf:
          - type: number
            minimum: 0
          - type: 'null'
        prediction_interval:
          anyOf:
          - $ref: '#/components/schemas/PredictionInterval'
          - type: 'null'
        is_peak:
          type: boolean
        scored:
          type: boolean
        exclusion_reason:
          anyOf:
          - type: string
          - type: 'null'
        quality:
          $ref: '#/components/schemas/Quality'
      description: scored=true только при наличии actual/model/seasonal_naive; для включённой в отчёт регрессии
        также требуется её значение. Иначе exclusion_reason заполнена. Регрессия null, если метод не оценивался.
        Факт и оценки факта различаются actual_kind.
    EvaluationPointPage:
      type: object
      additionalProperties: false
      required:
