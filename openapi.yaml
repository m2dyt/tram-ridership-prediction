        interval_start:
          type: string
          format: date-time
        interval_end:
          type: string
          format: date-time
        page:
          $ref: '#/components/schemas/Page'
      description: GeoJSON с дополнительными членами run/page. Ровно один сохранённый интервал. Значения совпадают
        с /points при тех же фильтрах; никакой скрытой агрегации. Нужно получить все страницы.
    EvaluationSummary:
      type: object
      additionalProperties: false
      required:
      - id
      - dataset_revision_id
      - network_revision_id
      - source_mode
      - profile
      - model
      - status
      - created_at
      - limitations
      properties:
        id:
          type: string
          format: uuid
        dataset_revision_id:
          type: string
          minLength: 1
          maxLength: 128
        network_revision_id:
          type: string
          minLength: 1
          maxLength: 128
        source_mode:
          $ref: '#/components/schemas/SourceMode'
        profile:
          $ref: '#/components/schemas/ForecastProfile'
        model:
          $ref: '#/components/schemas/ModelReference'
        status:
          type: string
          enum:
          - complete
          - insufficient_history
          - unavailable
        created_at:
          type: string
          format: date-time
        limitations:
          type: array
          items:
            type: string
      description: complete означает выполненную проверку, а не превосходство над базой. Недостаточная история
        сохраняет открытый критерий приёмки.
    EvaluationFold:
      type: object
      additionalProperties: false
      required:
      - id
      - as_of
      - training_start
      - training_end
      - test_start
      - test_end
      - point_count
      - model
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 128
        as_of:
          type: string
          format: date-time
        training_start:
          type: string
          format: date-time
        training_end:
          type: string
          format: date-time
        test_start:
          type: string
          format: date-time
        test_end:
          type: string
          format: date-time
        point_count:
          type: integer
          minimum: 0
        model:
          $ref: '#/components/schemas/ModelReference'
      description: training_end <= as_of <= test_start; длина теста равна горизонту. Все границы справа исключающие.
        Параметры моделей подбираются внутри обучающей части.
    EvaluationScore:
      type: object
      additionalProperties: false
      required:
      - method
      - route_id
      - demand_slice
      - sample_count
      - excluded_count
      - sum_actual
      - mae
      - wape
      - wape_unavailable_reason
      - interval_coverage
      - mean_interval_width
      properties:
        method:
          type: string
          enum:
          - model
          - seasonal_naive
          - regression
        route_id:
          anyOf:
          - type: string
            minLength: 1
            maxLength: 128
          - type: 'null'
        demand_slice:
          type: string
          enum:
          - all
          - peak
        sample_count:
          type: integer
          minimum: 0
        excluded_count:
          type: integer
          minimum: 0
        sum_actual:
          type: number
          minimum: 0
        mae:
          anyOf:
          - type: number
            minimum: 0
          - type: 'null'
        wape:
          anyOf:
          - type: number
            minimum: 0
          - type: 'null'
        wape_unavailable_reason:
          anyOf:
          - type: string
          - type: 'null'
        interval_coverage:
          anyOf:
          - type: number
            minimum: 0
            maximum: 1
          - type: 'null'
        mean_interval_width:
          anyOf:
          - type: number
            minimum: 0
          - type: 'null'
      description: route_id=null — все маршруты выборки. MAE в единицах показателя; WAPE=sum(abs(error))/sum(actual),
        доля без верхней границы. Если sum_actual=0 или sample_count=0, WAPE=null с причиной; MAE=null при
        sample_count=0. Базовые методы и модель сравниваются на одинаковых точках. Средние ошибки маршрутов
        не усреднять вместо расчёта на общей выборке.
