# Контракт HTTP API; примеры синтетические. Запуск: README.md.
openapi: 3.1.0
info:
  title: Tram Ridership Prediction API
  version: 0.1.0
  description: 'Исполняемый контракт по SPECIFICATION (2).md и IMPLEMENTATION_PLAN.md.

    Реализован backend с сезонной базой без обучения. Все примеры синтетические; реальные идентификаторы и
    качество модели не утверждаются. Отчёты оценки рассчитываются командой evaluate без обучения и сохраняются
    вместе с точками. Инструкция запуска находится в README.md.


    P0: справочники, история, прогнозы дня/месяца/года, карта, свежесть и проверка на истории.

    P1: prediction_interval допускается, но может быть null; переполнение отмечается флагом over_capacity;
    сценарный калькулятор выпуска доступен в /scenarios/fleet.


    Время: RFC 3339 с обязательным смещением; календарные границы Europe/Moscow, интервалы [start,end).

    Все from/to — полные границы шага; start < end. Любой запрос истории/точек ограничен 366 календарными днями.

    День/месяц/год — календарный период от forecast_start; отсутствующее число после прибавления месяца/года
    ограничивается последним числом целевого месяца.

    Год с месячным шагом начинается первого числа. Поддерживаемые сочетания возвращает capabilities, они не
    декартово произведение перечислений.


    validations — оплаты; boardings — посадки; occupancy — средняя наполненность одного вагона на участке,
    взвешенная по времени; occupancy_ratio — такое же среднее отношений к вместимости.

    validations и boardings суммируются; occupancy и occupancy_ratio никогда не суммируются. Для наполненности
    нужен уровень segment.

    Соответствие единиц: validations→validations, boardings/occupancy→passengers, occupancy_ratio→ratio. ratio
    может быть >1.

    Направление доступно только при наличии в источнике. Источник и происхождение значения — разные признаки.


    Клиент закрепляет dataset_revision_id/network_revision_id и run_id между картой и графиком. GET не запускает
    ML.

    Неизвестные query-параметры запрещены (422). Для массивов JSON порядок route_ids учитывается при проверке
    идемпотентности; порядок ключей объекта не учитывается.

    GET требует viewer или operator, POST — operator; роль определяется конфигурацией Bearer-токена.

    Зависимости между полями, принадлежность IDs, порядок дат и числовые границы диапазона проверяются приложением
    дополнительно к JSON Schema.

    '
servers:
- url: /api/v1
  description: API на том же origin; основной вариант для встроенного Swagger
- url: http://localhost:8000/api/v1
  description: Локальный backend для отдельного Swagger UI
tags:
- name: System
  description: Готовность, возможности и свежесть
- name: Catalogs
  description: Версионированная маршрутная сеть
- name: Observations
  description: Фактические и восстановленные значения
- name: Forecasts
  description: Асинхронные расчёты и неизменяемые результаты
- name: Evaluations
  description: Временная проверка качества и сравнение с базами
- name: Occupancy
  description: Оценка остатка по рейсам; дробное математическое ожидание, не идентификация людей
- name: Context
  description: Неизменяемые снимки погоды, мероприятий и геоданных
security:
- bearerAuth: []
paths:
  /health:
    get:
      tags:
      - System
      operationId: getHealth
      summary: Готовность API и БД
      description: Публичная проверка готовности без секретов. При недоступности БД возвращает 503 со схемой
        Health, не Error.
      parameters: []
      responses:
        '200':
          description: Успешный ответ.
          headers:
            X-Request-ID:
              description: ID запроса для поиска в журнале.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
              example:
                status: ready
                checked_at: '2026-09-20T18:02:00+03:00'
                api_version: v1
                database: up
        '503':
          description: API не готов обслуживать запросы.
          headers:
            X-Request-ID:
              description: ID запроса для поиска в журнале.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
      security: []
  /capabilities:
    get:
      tags:
      - System
      operationId: getCapabilities
      summary: Доступные показатели и профили
      description: Профили вычисляются из аудита данных и реестра моделей. Для каждого обязательного горизонта
        вернуть профиль с availability, даже если расчёт пока недоступен. Нет опубликованной версии — 503;
        указана неизвестная — 404. Клиент строит фильтры по этому ответу.
      parameters:
      - $ref: '#/components/parameters/DatasetRevisionOptional'
      responses:
        '200':
          description: Успешный ответ.
          headers:
            X-Request-ID:
              description: ID запроса для поиска в журнале.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Capabilities'
              examples:
                demo:
                  $ref: '#/components/examples/Capabilities'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'
  /data-status:
    get:
      tags:
      - System
      operationId: getDataStatus
      summary: Свежесть и режим источника
      description: Опрос по recommended_poll_seconds. Смена dataset_revision_id означает новую опубликованную
        версию; существующие run и курсоры сохраняют свою. replay/demo отображаются явно. Пустое хранилище
        — 200 с null версиями.
      parameters: []
      responses:
        '200':
          description: Успешный ответ.
          headers:
            X-Request-ID:
              description: ID запроса для поиска в журнале.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataStatus'
              examples:
                demo:
                  $ref: '#/components/examples/DataStatus'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'
  /routes:
    get:
      tags:
      - Catalogs
      operationId: listRoutes
      summary: Маршруты на дату
      description: Сортировка по route.id; только маршруты, действующие на valid_at. Пустая выборка — 200.
        Курсор закрепляет версию и дату.
      parameters:
      - $ref: '#/components/parameters/NetworkRevision'
      - $ref: '#/components/parameters/ValidAt'
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Успешный ответ.
          headers:
            X-Request-ID:
              description: ID запроса для поиска в журнале.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoutePage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'
  /routes/{route_id}:
    get:
      tags:
      - Catalogs
      operationId: getRoute
      summary: Схема маршрута, направления и остановки
      description: Полная топология одного маршрута в указанной версии сети на дату. Нельзя использовать текущую
        геометрию для исторической точки другой версии без явного сопоставления. Маршрут не действует на дату
        — 404.
      parameters:
      - $ref: '#/components/parameters/RoutePath'
      - $ref: '#/components/parameters/NetworkRevision'
      - $ref: '#/components/parameters/ValidAt'
      responses:
        '200':
          description: Успешный ответ.
          headers:
            X-Request-ID:
              description: ID запроса для поиска в журнале.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RouteDetail'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'
  /stops:
    get:
      tags:
      - Catalogs
      operationId: listStops
      summary: Справочник остановок
      description: Уникальные остановки, действующие на valid_at; сортировка по stop.id. Позиции повторных
        остановок находятся в RouteDetail. direction_id требует route_id. Неверная принадлежность — 422; неизвестный
        ID — 404.
      parameters:
      - $ref: '#/components/parameters/NetworkRevision'
      - $ref: '#/components/parameters/ValidAt'
      - $ref: '#/components/parameters/RouteId'
      - $ref: '#/components/parameters/DirectionId'
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Успешный ответ.
          headers:
            X-Request-ID:
              description: ID запроса для поиска в журнале.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StopPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'
  /observations:
    get:
      tags:
      - Observations
      operationId: getObservations
      summary: История наблюдений
      description: 'Читает сохранённый ряд выбранного профиля. Границы from/to соответствуют его шагу; выбранные
        точки целиком входят в [from,to). Отсутствующие значения внутри известного периода ряда выдаются как
        null с причиной; период вне покрытия возвращает пустой список. Нули не подставляются. Все пространственные
        фильтры соединяются AND; неизвестный ID — 404, неверная принадлежность или сочетание — 422. Нельзя
        фильтровать остановку в агрегате уровня route. Валидная пустая выборка — 200 с items=[]; неизвестные
        query-параметры — 422. Сортировка точек: interval_start, route_id, direction_id (null первым), stop_sequence,
        stop_id, segment_id. Курсор привязан к версии и фильтрам; проход страниц не смешивает версии.'
      parameters:
      - $ref: '#/components/parameters/DatasetRevision'
      - $ref: '#/components/parameters/ObservationProfileId'
      - name: from
        in: query
        required: true
        description: Начало включается; локальная граница шага профиля. Вместе с to выбирает полные интервалы,
          не обрезает и не агрегирует.
        schema:
          type: string
          format: date-time
        example: '2026-09-19T08:00:00+03:00'
      - name: to
        in: query
        required: true
        description: Конец исключается; from < to, граница шага профиля. Не более 366 календарных дней на запрос;
          большие периоды разбиваются.
        schema:
          type: string
          format: date-time
        example: '2026-09-19T09:00:00+03:00'
      - $ref: '#/components/parameters/RouteId'
      - $ref: '#/components/parameters/DirectionId'
      - $ref: '#/components/parameters/StopId'
      - $ref: '#/components/parameters/StopSequence'
      - $ref: '#/components/parameters/SegmentId'
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Успешный ответ.
          headers:
            X-Request-ID:
              description: ID запроса для поиска в журнале.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ObservationPage'
              examples:
                demo:
                  $ref: '#/components/examples/Observations'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'
  /forecast-runs:
    post:
      tags:
      - Forecasts
      operationId: createForecastRun
      summary: Создать задание прогноза
      description: Требуется роль operator. В одной транзакции проверяет профиль, маршруты, временные границы
        и готовую модель, закрепляет версии и ставит задание в очередь. Обучение не запускает. До публикации
        результат не читается. Первый запрос — 202; повтор с тем же ключом/телом — 200 и текущее состояние
        того же run (в том числе failed); другой payload — 409. Ключ хранится минимум 24 часа. Повтор после
        failed с новым ключом создаёт новое задание. Исторический as_of допускается только при наличии воспроизводимого
        набора признаков и модели, обученной без будущих данных.
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Повтор ранее принятого запроса; возвращается тот же запуск.
          headers:
            X-Request-ID:
              description: ID запроса для поиска в журнале.
              schema:
                type: string
            Location:
              schema:
                type: string
              description: URI существующего запуска.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForecastRun'
              examples:
                demo:
                  $ref: '#/components/examples/CompletedRun'
        '202':
          description: Успешный ответ.
          headers:
            X-Request-ID:
              description: ID запроса для поиска в журнале.
              schema:
                type: string
            Location:
              schema:
                type: string
              description: Относительный URI /api/v1/forecast-runs/{run_id}.
            Retry-After:
              description: Рекомендуемая задержка в секундах перед следующим опросом/повтором.
              schema:
                type: integer
                minimum: 1
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForecastRun'
              examples:
                demo:
                  $ref: '#/components/examples/QueuedRun'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateForecastRun'
            examples:
              demo:
                $ref: '#/components/examples/CreateForecast'
              month:
                $ref: '#/components/examples/CreateForecastMonth'
              year:
                $ref: '#/components/examples/CreateForecastYear'
    get:
      tags:
      - Forecasts
      operationId: listForecastRuns
      summary: Найти сохранённые запуски
      description: 'dataset_revision_id здесь является необязательным фильтром: без него поиск по всем доступным
        версиям, без подстановки latest. Сортировка created_at DESC, id DESC. route_id означает, что маршрут
        входит в область запуска. Для последнего успешного прогноза указать версию, profile_id, forecast_start,
        status=succeeded и limit=1. Первая страница фиксирует верхнюю границу created_at в курсоре; новые задания
        не вставляются между уже читаемыми страницами. Фильтры статуса проверяются по снимку первой страницы;
        в items возвращается текущее состояние найденных запусков.'
      parameters:
      - $ref: '#/components/parameters/DatasetRevisionOptional'
      - $ref: '#/components/parameters/ProfileId'
      - $ref: '#/components/parameters/Horizon'
      - $ref: '#/components/parameters/RouteId'
      - $ref: '#/components/parameters/RunStatus'
      - $ref: '#/components/parameters/ForecastStart'
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Успешный ответ.
          headers:
            X-Request-ID:
              description: ID запроса для поиска в журнале.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForecastRunPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'
  /forecast-runs/{run_id}:
    get:
      tags:
      - Forecasts
      operationId: getForecastRun
      summary: Статус и параметры запуска
      description: 'queued/running: повторить запрос по Retry-After. failed: failure содержит безопасное описание.
        succeeded: читать points/map. Модель, профиль, версии, as_of и период не меняются после создания.'
      parameters:
      - $ref: '#/components/parameters/RunPath'
      responses:
        '200':
          description: Успешный ответ.
          headers:
            X-Request-ID:
              description: ID запроса для поиска в журнале.
              schema:
                type: string
            Retry-After:
              description: Рекомендуемая задержка в секундах перед следующим опросом/повтором.
              schema:
                type: integer
                minimum: 1
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForecastRun'
              examples:
                demo:
                  $ref: '#/components/examples/CompletedRun'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'
  /forecast-runs/{run_id}/points:
    get:
      tags:
      - Forecasts
      operationId: getForecastPoints
      summary: Прогноз для графика
      description: 'Только succeeded; иначе 409 RESULT_NOT_READY или RUN_FAILED. from/to находятся внутри [forecast_start,forecast_end]
        и на сетке профиля. Читает уже рассчитанные точки. Пустая выборка поддерживаемых фильтров — 200. Все
        пространственные фильтры соединяются AND; неизвестный ID — 404, неверная принадлежность или сочетание
        — 422. Нельзя фильтровать остановку в агрегате уровня route. Валидная пустая выборка — 200 с items=[];
        неизвестные query-параметры — 422. Сортировка точек: interval_start, route_id, direction_id (null первым),
        stop_sequence, stop_id, segment_id. Курсор привязан к версии и фильтрам; проход страниц не смешивает
        версии.'
      parameters:
      - $ref: '#/components/parameters/RunPath'
      - $ref: '#/components/parameters/From'
      - $ref: '#/components/parameters/To'
      - $ref: '#/components/parameters/RouteId'
      - $ref: '#/components/parameters/DirectionId'
      - $ref: '#/components/parameters/StopId'
      - $ref: '#/components/parameters/StopSequence'
      - $ref: '#/components/parameters/SegmentId'
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Успешный ответ.
          headers:
            X-Request-ID:
              description: ID запроса для поиска в журнале.
              schema:
                type: string
          content:
