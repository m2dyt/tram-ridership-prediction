      description: stop → Point; segment → LineString; route/route_direction → LineString или MultiLineString.
        При отсутствующей геометрии geometry=null и quality.flags содержит missing_geometry. ID стабилен в
        рамках запуска и интервала.
    ForecastMap:
      type: object
      additionalProperties: false
      required:
      - type
