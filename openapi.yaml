          type: number
          exclusiveMinimum: 0
          exclusiveMaximum: 1
        method:
          type: string
      description: Необязательный диапазон P1. lower <= прогноз <= upper; фактическое покрытие проверяется
        отдельно в evaluation. Номинальное покрытие не является вероятностью точного равенства прогнозу.
    ForecastPoint:
      type: object
      additionalProperties: false
      required:
      - spatial
