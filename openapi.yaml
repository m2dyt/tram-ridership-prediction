      summary: Метрики, базовые методы и ограничения
      description: Указывает fold, доступность признаков и правило пиков. Модель и базовые методы имеют общую
        выборку сравнения. insufficient_history/unavailable возвращаются с 200, пустыми folds/scores при отсутствии
        проверки и объяснением в limitations. Регрессия — собственный базовый метод, если иное не подтверждено;
        не модель ЕДЦ.
