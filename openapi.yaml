components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Токен закрытого стенда из конфигурации. Роли viewer/operator; выдача токенов не входит в
        этот контракт. Не предполагает JWT.
  parameters:
    DatasetRevision:
      name: dataset_revision_id
      in: query
      required: true
      description: Неизменяемая версия данных из /data-status.
      schema:
        type: string
        minLength: 1
        maxLength: 128
      example: demo-data-v1
    DatasetRevisionOptional:
      name: dataset_revision_id
      in: query
      required: false
      description: Необязательная версия данных. В capabilities без неё выбирается текущая опубликованная версия;
        в списках запусков/отчётов отсутствие означает поиск по всем версиям. Для воспроизводимости передавайте
        явно.
      schema:
        type: string
        minLength: 1
        maxLength: 128
    NetworkRevision:
      name: network_revision_id
      in: query
      required: true
      description: Версия маршрутной сети из capabilities или run.
      schema:
        type: string
        minLength: 1
        maxLength: 128
      example: demo-network-v1
    ValidAt:
      name: valid_at
      in: query
      required: true
      description: Дата действия справочника в Europe/Moscow.
      schema:
        type: string
        format: date
      example: '2026-09-21'
    RouteId:
      name: route_id
      in: query
      required: false
      description: Фильтр маршрута. Не номер маршрута.
      schema:
        type: string
        minLength: 1
        maxLength: 128
      example: demo-route-01
    DirectionId:
      name: direction_id
      in: query
      required: false
      description: Требует route_id. Направление должно существовать в версии сети и поддерживаться пространственным
        уровнем.
      schema:
        type: string
        minLength: 1
        maxLength: 128
    StopId:
      name: stop_id
      in: query
      required: false
      description: Требует route_id и профиль уровня stop. Без stop_sequence возвращает все вхождения этой
        остановки в выбранном направлении/маршруте.
      schema:
        type: string
        minLength: 1
        maxLength: 128
    StopSequence:
      name: stop_sequence
      in: query
      required: false
      description: Требует stop_id. Для точного выбора в нескольких направлениях дополнительно задайте direction_id.
      schema:
        type: integer
        minimum: 1
    SegmentId:
      name: segment_id
      in: query
      required: false
      description: Требует route_id и уровень segment. Несовместим с stop_id и stop_sequence.
      schema:
        type: string
        minLength: 1
        maxLength: 128
    From:
      name: from
      in: query
      required: true
      description: Начало включается; локальная граница шага профиля. Вместе с to выбирает полные интервалы,
        не обрезает и не агрегирует.
      schema:
        type: string
        format: date-time
      example: '2026-09-21T08:00:00+03:00'
    To:
      name: to
      in: query
      required: true
      description: Конец исключается; from < to, граница шага профиля. Не более 366 календарных дней на запрос;
        большие периоды разбиваются.
      schema:
        type: string
        format: date-time
      example: '2026-09-21T09:00:00+03:00'
    Limit:
      name: limit
      in: query
      required: false
      description: Максимум элементов страницы.
      schema:
        type: integer
        minimum: 1
        maximum: 1000
        default: 200
    Cursor:
      name: cursor
      in: query
      required: false
      description: Курсор предыдущей страницы. Версия, фильтры и limit должны совпадать; иначе 400 INVALID_CURSOR.
      schema:
        type: string
        maxLength: 4096
    ProfileId:
      name: profile_id
      in: query
      required: false
      description: ID профиля прогноза; вместе с версией данных однозначно задаёт показатель, горизонт и шаг.
      schema:
        type: string
        minLength: 1
        maxLength: 128
    ObservationProfileId:
      name: observation_profile_id
      in: query
      required: true
      description: ID профиля истории из capabilities.
      schema:
        type: string
        minLength: 1
        maxLength: 128
      example: demo-validations-stop-hour
    RunStatus:
      name: status
      in: query
      required: false
      description: Фильтр статуса; succeeded для поиска опубликованных результатов.
      schema:
        $ref: '#/components/schemas/RunStatus'
    Horizon:
      name: horizon
      in: query
      required: false
      description: Фильтр горизонта.
      schema:
        $ref: '#/components/schemas/Horizon'
    ForecastStart:
      name: forecast_start
      in: query
      required: false
      description: Точное начало прогнозного периода. Вместе с dataset_revision_id/profile_id/status=succeeded
        позволяет найти нужный запуск.
      schema:
        type: string
        format: date-time
    ModelId:
      name: model_id
      in: query
      required: false
      description: Фильтр по модели.
      schema:
        type: string
        minLength: 1
        maxLength: 128
    EvaluationStatus:
      name: status
      in: query
      required: false
      description: Статус проверки качества.
      schema:
        type: string
        enum:
        - complete
        - insufficient_history
        - unavailable
    DemandSlice:
      name: demand_slice
      in: query
      required: false
      description: По умолчанию all; peak использует правило, зафиксированное в отчёте до оценки.
      schema:
        type: string
        enum:
        - all
        - peak
      example: all
    FoldId:
      name: fold_id
      in: query
      required: false
      description: Фильтр fold; при пересечении тестовых периодов точки разных folds остаются отдельными.
      schema:
        type: string
        minLength: 1
        maxLength: 128
    IntervalStart:
      name: interval_start
      in: query
      required: true
      description: Точное начало одного сохранённого интервала; обязательно внутри периода run и на его сетке.
      schema:
        type: string
        format: date-time
      example: '2026-09-21T08:00:00+03:00'
    RoutePath:
      name: route_id
      in: path
      required: true
      description: ID маршрута в выбранной версии сети.
      schema:
        type: string
        minLength: 1
        maxLength: 128
      example: demo-route-01
    RunPath:
      name: run_id
      in: path
      required: true
      description: UUID запуска.
      schema:
        type: string
        format: uuid
      example: 11111111-1111-4111-8111-111111111111
    EvaluationPath:
      name: evaluation_id
      in: path
      required: true
      description: UUID отчёта.
      schema:
        type: string
        format: uuid
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Обязательный ключ повтора. Область — пользователь и операция; срок хранения минимум 24 часа.
        То же JSON-тело независимо от порядка ключей возвращает тот же run; иное тело — 409.
      schema:
        type: string
        minLength: 8
        maxLength: 128
        pattern: ^[A-Za-z0-9._:-]+$
      example: demo-forecast-20260921-01
  responses:
    BadRequest:
      description: Некорректный синтаксис запроса или курсор (INVALID_CURSOR).
      headers:
        X-Request-ID:
          description: ID запроса для поиска в журнале.
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: BAD_REQUEST
            message: Некорректный синтаксис запроса или курсор (INVALID_CURSOR).
            request_id: demo-request-01
            details: []
    Unauthorized:
      description: Токен отсутствует или недействителен.
      headers:
        X-Request-ID:
          description: ID запроса для поиска в журнале.
          schema:
            type: string
        WWW-Authenticate:
          schema:
            type: string
          description: Bearer
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: UNAUTHORIZED
            message: Токен отсутствует или недействителен.
            request_id: demo-request-01
            details: []
    Forbidden:
      description: Недостаточно прав; создание прогноза требует operator.
      headers:
        X-Request-ID:
          description: ID запроса для поиска в журнале.
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: FORBIDDEN
            message: Недостаточно прав; создание прогноза требует operator.
            request_id: demo-request-01
            details: []
    NotFound:
      description: Версия, ресурс, профиль или запрошенный маршрут не найдены.
      headers:
        X-Request-ID:
          description: ID запроса для поиска в журнале.
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: NOT_FOUND
            message: Версия, ресурс, профиль или запрошенный маршрут не найдены.
            request_id: demo-request-01
            details: []
    Conflict:
      description: Результат ещё не готов, запуск завершился ошибкой (RUN_FAILED), либо ключ повторён с другим
        телом (IDEMPOTENCY_CONFLICT).
      headers:
        X-Request-ID:
          description: ID запроса для поиска в журнале.
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: RESULT_NOT_READY
            message: Результат ещё не готов, запуск завершился ошибкой (RUN_FAILED), либо ключ повторён с другим
              телом (IDEMPOTENCY_CONFLICT).
            request_id: demo-request-01
            details: []
    ValidationError:
      description: 'Некорректные поля/сочетания фильтров, неподдерживаемый профиль, недостаточная история или
        нет подходящей модели. codes: VALIDATION_ERROR, UNSUPPORTED_PROFILE, INSUFFICIENT_HISTORY, MODEL_UNAVAILABLE.'
      headers:
        X-Request-ID:
          description: ID запроса для поиска в журнале.
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: VALIDATION_ERROR
            message: 'Некорректные поля/сочетания фильтров, неподдерживаемый профиль, недостаточная история
              или нет подходящей модели. codes: VALIDATION_ERROR, UNSUPPORTED_PROFILE, INSUFFICIENT_HISTORY,
              MODEL_UNAVAILABLE.'
            request_id: demo-request-01
            details: []
    RateLimited:
      description: Превышена частота запросов или лимит заданий.
      headers:
        X-Request-ID:
          description: ID запроса для поиска в журнале.
          schema:
            type: string
        Retry-After:
          description: Рекомендуемая задержка в секундах перед следующим опросом/повтором.
          schema:
            type: integer
            minimum: 1
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: RATE_LIMITED
            message: Превышена частота запросов или лимит заданий.
            request_id: demo-request-01
            details: []
    Unavailable:
      description: Временная недоступность БД, очереди или опубликованных данных.
      headers:
        X-Request-ID:
          description: ID запроса для поиска в журнале.
          schema:
            type: string
        Retry-After:
          description: Рекомендуемая задержка в секундах перед следующим опросом/повтором.
          schema:
            type: integer
            minimum: 1
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: SERVICE_UNAVAILABLE
            message: Временная недоступность БД, очереди или опубликованных данных.
            request_id: demo-request-01
            details: []
    InternalError:
      description: Непредвиденная ошибка. Подробности только в серверном журнале.
      headers:
        X-Request-ID:
          description: ID запроса для поиска в журнале.
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: INTERNAL_ERROR
            message: Непредвиденная ошибка. Подробности только в серверном журнале.
            request_id: demo-request-01
            details: []
  schemas:
    Metric:
      type: string
      enum:
      - validations
      - boardings
      - occupancy
      - occupancy_ratio
      description: Число оплат; посадки; средняя наполненность одного вагона на участке; средняя доля заполнения.
        Доступность определяется профилем.
    Unit:
      type: string
      enum:
      - validations
      - passengers
      - ratio
      description: Для ratio 1.0 означает 100%. WAPE также передаётся долей, но не является целевым показателем.
    Horizon:
      type: string
      enum:
      - day
      - month
      - year
    Resolution:
      type: string
      enum:
      - hour
      - day
      - month
    SpatialLevel:
      type: string
      enum:
      - route
      - route_direction
      - stop
      - segment
    SourceMode:
      type: string
      enum:
      - live
      - batch
      - replay
      - demo
      description: Режим источника. Все примеры в этом документе синтетические, source_mode=demo.
    RunStatus:
      type: string
      enum:
      - queued
      - running
      - succeeded
      - failed
    Quality:
      type: object
      additionalProperties: false
      required:
      - status
      - coverage_ratio
      - flags
      properties:
        status:
          type: string
          enum:
          - ok
          - partial
          - missing
          - unverified
        coverage_ratio:
          anyOf:
          - type: number
            minimum: 0
            maximum: 1
          - type: 'null'
          description: Доля покрытия по методике аудита; null, если определить нельзя.
        flags:
          type: array
          items:
            type: string
          uniqueItems: true
      description: Качество источника/расчёта; не заменяет метрики точности модели.
    Page:
      type: object
      additionalProperties: false
      required:
      - next_cursor
      - has_more
      properties:
        next_cursor:
          anyOf:
          - type: string
          - type: 'null'
        has_more:
          type: boolean
      description: has_more=true тогда и только тогда, когда next_cursor не null. Курсор непрозрачен и привязан
        к фильтрам и версии.
    ErrorDetail:
      type: object
      additionalProperties: false
      required:
      - field
      - reason
      properties:
        field:
          type: string
        reason:
          type: string
      description: field — путь поля или имя query-параметра.
    Error:
      type: object
      additionalProperties: false
      required:
      - code
      - message
      - request_id
      - details
      properties:
        code:
          type: string
          enum:
          - BAD_REQUEST
          - INVALID_CURSOR
          - UNAUTHORIZED
          - FORBIDDEN
          - NOT_FOUND
          - VALIDATION_ERROR
          - UNSUPPORTED_PROFILE
          - INSUFFICIENT_HISTORY
          - MODEL_UNAVAILABLE
          - RESULT_NOT_READY
          - RUN_FAILED
          - IDEMPOTENCY_CONFLICT
          - RATE_LIMITED
          - SERVICE_UNAVAILABLE
          - INTERNAL_ERROR
        message:
          type: string
        request_id:
          type: string
        details:
          type: array
          items:
            $ref: '#/components/schemas/ErrorDetail'
    SpatialKey:
      type: object
      additionalProperties: false
      required:
      - level
      - route_id
      - direction_id
      - stop_id
      - stop_sequence
      - segment_id
      properties:
        level:
          $ref: '#/components/schemas/SpatialLevel'
        route_id:
          type: string
          minLength: 1
          maxLength: 128
        direction_id:
          anyOf:
          - type: string
            minLength: 1
            maxLength: 128
          - type: 'null'
        stop_id:
          anyOf:
          - type: string
            minLength: 1
            maxLength: 128
          - type: 'null'
        stop_sequence:
          anyOf:
          - type: integer
            minimum: 1
          - type: 'null'
        segment_id:
          anyOf:
          - type: string
            minLength: 1
            maxLength: 128
          - type: 'null'
      description: 'Ключ внутри network_revision_id. route: только route_id; route_direction: также direction_id;
        stop: stop_id и stop_sequence, direction_id при наличии; segment: segment_id, direction_id при наличии.
        Лишние измерения равны null.'
      allOf:
      - if:
          properties:
            level:
              const: route
        then:
          properties:
            direction_id:
              type: 'null'
            stop_id:
              type: 'null'
            stop_sequence:
              type: 'null'
            segment_id:
              type: 'null'
      - if:
          properties:
            level:
              const: route_direction
        then:
          properties:
            direction_id:
              type: string
              minLength: 1
              maxLength: 128
            stop_id:
              type: 'null'
            stop_sequence:
              type: 'null'
            segment_id:
              type: 'null'
      - if:
          properties:
            level:
              const: stop
        then:
          properties:
            stop_id:
              type: string
              minLength: 1
              maxLength: 128
            stop_sequence:
              type: integer
              minimum: 1
            segment_id:
              type: 'null'
      - if:
          properties:
            level:
              const: segment
        then:
          properties:
            segment_id:
              type: string
              minLength: 1
              maxLength: 128
            stop_id:
              type: 'null'
            stop_sequence:
              type: 'null'
    Position:
      type: array
      prefixItems:
      - type: number
        minimum: -180
        maximum: 180
      - type: number
        minimum: -90
        maximum: 90
      items: false
      minItems: 2
      maxItems: 2
      description: 'WGS84: [долгота, широта].'
    PointGeometry:
      type: object
      additionalProperties: false
      required:
      - type
      - coordinates
      properties:
        type:
          const: Point
          type: string
        coordinates:
          $ref: '#/components/schemas/Position'
    LineGeometry:
      type: object
      additionalProperties: false
      required:
      - type
      - coordinates
      properties:
        type:
          const: LineString
          type: string
        coordinates:
          type: array
          items:
            $ref: '#/components/schemas/Position'
          minItems: 2
    MultiLineGeometry:
      type: object
      additionalProperties: false
      required:
      - type
      - coordinates
      properties:
        type:
          const: MultiLineString
          type: string
        coordinates:
          type: array
          items:
            type: array
            items:
              $ref: '#/components/schemas/Position'
            minItems: 2
          minItems: 1
    Geometry:
      oneOf:
      - $ref: '#/components/schemas/PointGeometry'
      - $ref: '#/components/schemas/LineGeometry'
      - $ref: '#/components/schemas/MultiLineGeometry'
    Health:
      type: object
      additionalProperties: false
      required:
      - status
      - checked_at
      - api_version
      - database
      properties:
        status:
          type: string
          enum:
          - ready
          - unavailable
        checked_at:
          type: string
          format: date-time
        api_version:
          type: string
        database:
          type: string
          enum:
          - up
          - down
    SourceStatus:
      type: object
      additionalProperties: false
      required:
      - source
      - source_mode
      - event_watermark
      - ingested_at
      - freshness
      - stale_after_seconds
      - quality
      properties:
        source:
          type: string
          enum:
          - validations
          - telemetry
          - network
          - capacity
          - external
        source_mode:
          $ref: '#/components/schemas/SourceMode'
        event_watermark:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          description: Время последнего события источника; это не гарантия полноты всех предыдущих интервалов.
        ingested_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          description: Когда данные получены системой.
        freshness:
          type: string
          enum:
          - fresh
          - stale
          - unknown
        stale_after_seconds:
          anyOf:
          - type: integer
            minimum: 1
          - type: 'null'
        quality:
          $ref: '#/components/schemas/Quality'
    DataStatus:
      type: object
      additionalProperties: false
      required:
      - checked_at
      - dataset_revision_id
      - network_revision_id
      - source_mode
      - sources
      - recommended_poll_seconds
      - warnings
      properties:
        checked_at:
          type: string
          format: date-time
        dataset_revision_id:
          anyOf:
          - type: string
            minLength: 1
            maxLength: 128
          - type: 'null'
        network_revision_id:
          anyOf:
          - type: string
            minLength: 1
            maxLength: 128
          - type: 'null'
        source_mode:
          $ref: '#/components/schemas/SourceMode'
        sources:
          type: array
          items:
            $ref: '#/components/schemas/SourceStatus'
        recommended_poll_seconds:
          type: integer
          minimum: 5
        warnings:
          type: array
          items:
            type: string
      description: Если опубликованных данных нет, версии равны null. source_mode относится к целевым данным;
        источники могут иметь собственные режимы.
    ObservationProfile:
      type: object
      additionalProperties: false
      required:
      - id
      - metric
      - unit
      - spatial_level
      - resolution
      - route_ids
      - history_start
      - history_end
      - aggregation_method
      - limitations
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 128
        metric:
          $ref: '#/components/schemas/Metric'
        unit:
          $ref: '#/components/schemas/Unit'
        spatial_level:
          $ref: '#/components/schemas/SpatialLevel'
        resolution:
          $ref: '#/components/schemas/Resolution'
        route_ids:
          type: array
          items:
            type: string
            minLength: 1
            maxLength: 128
          minItems: 1
          uniqueItems: true
        history_start:
          type: string
          format: date-time
        history_end:
          type: string
          format: date-time
        aggregation_method:
          type: string
        limitations:
          type: array
          items:
            type: string
      description: Доступное сочетание показателя, пространственного уровня и шага истории. history_end исключается.
        Покрытие отдельных рядов может быть неполным.
    ForecastProfile:
      type: object
      additionalProperties: false
      required:
      - id
      - observation_profile_id
      - metric
      - unit
      - spatial_level
      - horizon
      - resolution
      - route_ids
      - aggregation_method
      - availability
      - unavailable_reason
      - allowed_as_of_start
      - allowed_as_of_end
      - forecast_start_min
      - forecast_start_max
      - start_alignment
      - evaluation_status
      - prediction_interval_available
      - limitations
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 128
        observation_profile_id:
          type: string
          minLength: 1
          maxLength: 128
        metric:
          $ref: '#/components/schemas/Metric'
        unit:
          $ref: '#/components/schemas/Unit'
        spatial_level:
          $ref: '#/components/schemas/SpatialLevel'
        horizon:
          $ref: '#/components/schemas/Horizon'
        resolution:
          $ref: '#/components/schemas/Resolution'
        route_ids:
          type: array
          items:
            type: string
            minLength: 1
            maxLength: 128
          minItems: 1
          uniqueItems: true
        aggregation_method:
          type: string
        availability:
          type: string
          enum:
          - available
          - unavailable
        unavailable_reason:
          anyOf:
          - type: string
          - type: 'null'
        allowed_as_of_start:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
        allowed_as_of_end:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
        forecast_start_min:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
        forecast_start_max:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
        start_alignment:
          type: string
          enum:
          - local_midnight
          - month_start
        evaluation_status:
          type: string
          enum:
          - pending
          - complete
          - insufficient_history
        prediction_interval_available:
          type: boolean
        limitations:
          type: array
          items:
            type: string
      description: Границы допустимых as_of и forecast_start включаются; у unavailable могут быть null. Для
        available границы заполнены. Допустимость также зависит от маршрутов, истории и модели на дату as_of;
        точная проверка при POST. year/month начинается первого числа. Метрика и единица совпадают со связанным
        профилем истории.
    Capabilities:
      type: object
      additionalProperties: false
      required:
      - dataset_revision_id
      - network_revision_id
      - source_mode
      - timezone
      - observation_profiles
      - forecast_profiles
      - max_page_size
      - max_routes_per_run
      - warnings
      properties:
        dataset_revision_id:
          type: string
          minLength: 1
          maxLength: 128
        network_revision_id:
          type: string
          minLength: 1
          maxLength: 128
        source_mode:
          $ref: '#/components/schemas/SourceMode'
        timezone:
          type: string
          const: Europe/Moscow
        observation_profiles:
          type: array
          items:
            $ref: '#/components/schemas/ObservationProfile'
        forecast_profiles:
          type: array
          items:
            $ref: '#/components/schemas/ForecastProfile'
        max_page_size:
          type: integer
          const: 1000
        max_routes_per_run:
          type: integer
          const: 100
        warnings:
          type: array
          items:
            type: string
    Route:
      type: object
      additionalProperties: false
      required:
      - id
      - number
      - name
      - valid_from
      - valid_to
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 128
        number:
          type: string
        name:
          type: string
        valid_from:
          type: string
          format: date
        valid_to:
          anyOf:
          - type: string
            format: date
          - type: 'null'
      description: valid_to — исключающая дата или null. ID стабилен внутри версии сети; number не используется
        как ключ.
    Stop:
      type: object
      additionalProperties: false
      required:
      - id
      - name
      - geometry
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 128
        name:
          type: string
        geometry:
          anyOf:
          - $ref: '#/components/schemas/PointGeometry'
          - type: 'null'
    RouteStop:
      type: object
      additionalProperties: false
      required:
      - stop_id
      - sequence
      properties:
        stop_id:
          type: string
          minLength: 1
          maxLength: 128
        sequence:
          type: integer
          minimum: 1
    Segment:
      type: object
      additionalProperties: false
      required:
      - id
      - from_stop_id
      - to_stop_id
      - from_sequence
      - to_sequence
      - geometry
      properties:
        id:
          type: string
          minLength: 1
