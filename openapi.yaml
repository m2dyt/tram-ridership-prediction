      - interval_end
      - value
      - missing_reason
      - value_kind
      - prediction_interval
      - quality
      properties:
        spatial:
          $ref: '#/components/schemas/SpatialKey'
        interval_start:
          type: string
          format: date-time
        interval_end:
          type: string
          format: date-time
        value:
          anyOf:
          - type: number
            minimum: 0
          - type: 'null'
        missing_reason:
          anyOf:
          - type: string
          - type: 'null'
        value_kind:
          type: string
          const: forecast
        prediction_interval:
          anyOf:
          - $ref: '#/components/schemas/PredictionInterval'
          - type: 'null'
        quality:
          $ref: '#/components/schemas/Quality'
      description: Показатель, единица, шаг, происхождение входа и версия находятся в run. Для null обязательна
        причина, диапазон null. Значение прогноза может быть дробным даже для количества оплат.
      allOf:
      - if:
          properties:
            value:
              type: 'null'
        then:
          properties:
            missing_reason:
              type: string
              minLength: 1
            prediction_interval:
              type: 'null'
        else:
          properties:
            missing_reason:
              type: 'null'
      examples:
      - spatial:
          level: stop
          route_id: demo-route-01
          direction_id: demo-outbound
          stop_id: demo-stop-01
          stop_sequence: 1
          segment_id: null
        interval_start: '2026-09-21T08:00:00+03:00'
        interval_end: '2026-09-21T09:00:00+03:00'
        value: 42.5
        missing_reason: null
        value_kind: forecast
        prediction_interval: null
        quality:
          status: unverified
          coverage_ratio: null
          flags:
          - synthetic_example
      - spatial:
          level: stop
          route_id: demo-route-01
          direction_id: demo-outbound
          stop_id: demo-stop-01
          stop_sequence: 1
          segment_id: null
        interval_start: '2026-09-21T08:00:00+03:00'
        interval_end: '2026-09-21T09:00:00+03:00'
        value: null
        missing_reason: insufficient_series_history
        value_kind: forecast
        prediction_interval: null
        quality:
          status: missing
          coverage_ratio: 0
          flags:
          - insufficient_series_history
    ForecastPointPage:
      type: object
      additionalProperties: false
      required:
