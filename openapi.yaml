      summary: Отчёты проверки на истории
      description: Отчёты публикуются offline-конвейером. dataset_revision_id — фильтр; без него поиск по всем
        версиям. created_at DESC, id DESC; снимок списка фиксируется курсором. Каждый отчёт относится к одному
