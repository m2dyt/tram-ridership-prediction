      - dataset_revision_id
      - network_revision_id
      - source_mode
      - profile
      - items
      - page
      properties:
        dataset_revision_id:
          type: string
          minLength: 1
          maxLength: 128
        network_revision_id:
          type: string
          minLength: 1
          maxLength: 128
        source_mode:
          $ref: '#/components/schemas/SourceMode'
        profile:
          $ref: '#/components/schemas/ObservationProfile'
        items:
          type: array
          items:
            $ref: '#/components/schemas/ObservationPoint'
        page:
          $ref: '#/components/schemas/Page'
    CreateForecastRun:
      type: object
      additionalProperties: false
      required:
      - dataset_revision_id
      - profile_id
      - route_ids
      - as_of
      - forecast_start
      properties:
        dataset_revision_id:
          type: string
          minLength: 1
          maxLength: 128
        profile_id:
          type: string
          minLength: 1
          maxLength: 128
        route_ids:
          type: array
          items:
            type: string
            minLength: 1
            maxLength: 128
          minItems: 1
          maxItems: 100
          uniqueItems: true
        as_of:
          type: string
          format: date-time
        forecast_start:
          type: string
          format: date-time
      description: Применение опубликованной модели. Модель выбирается сервером для профиля и as_of и закрепляется
        в запуске. Нельзя использовать наблюдения или признаки, неизвестные на as_of. forecast_start >= as_of;
        начало в 00:00 Europe/Moscow, для year/month — первое число. Горизонт, показатель и шаг задаются профилем;
        направления/остановки фильтруются при чтении результата.
    ModelReference:
      type: object
      additionalProperties: false
      required:
      - id
      - version
      - method
      - training_history_end
      - feature_set_version
      - is_baseline
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 128
        version:
          type: string
        method:
          type: string
        training_history_end:
          type: string
          format: date-time
        feature_set_version:
          type: string
          minLength: 1
          maxLength: 128
        is_baseline:
          type: boolean
      description: training_history_end <= as_of. Дата реального обучения может быть позднее при воспроизводимом
        backtesting, но доступность всех данных и подбор модели ограничены as_of.
    RunFailure:
      type: object
      additionalProperties: false
      required:
      - code
      - message
      - retryable
      properties:
        code:
          type: string
        message:
          type: string
        retryable:
          type: boolean
    ForecastRun:
      type: object
      additionalProperties: false
      required:
      - id
      - status
      - dataset_revision_id
      - network_revision_id
      - profile
      - route_ids
      - source_mode
      - timezone
      - as_of
      - history_end
      - forecast_start
      - forecast_end
      - model
      - created_at
      - started_at
      - calculated_at
      - finished_at
      - point_count
      - quality
      - warnings
      - failure
      properties:
        id:
          type: string
          format: uuid
        status:
          $ref: '#/components/schemas/RunStatus'
        dataset_revision_id:
          type: string
          minLength: 1
          maxLength: 128
        network_revision_id:
          type: string
          minLength: 1
          maxLength: 128
        profile:
          $ref: '#/components/schemas/ForecastProfile'
        route_ids:
          type: array
          items:
            type: string
            minLength: 1
            maxLength: 128
          minItems: 1
          maxItems: 100
          uniqueItems: true
        source_mode:
          $ref: '#/components/schemas/SourceMode'
        timezone:
          type: string
          const: Europe/Moscow
        as_of:
          type: string
          format: date-time
        history_end:
          type: string
          format: date-time
        forecast_start:
          type: string
          format: date-time
        forecast_end:
          type: string
          format: date-time
        model:
          $ref: '#/components/schemas/ModelReference'
        created_at:
          type: string
          format: date-time
        started_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
        calculated_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          description: Заполнено только после успешного завершения.
        finished_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          description: Заполнено для succeeded и failed.
        point_count:
          type: integer
          minimum: 0
        quality:
          $ref: '#/components/schemas/Quality'
        warnings:
          type: array
          items:
            type: string
        failure:
          anyOf:
          - $ref: '#/components/schemas/RunFailure'
          - type: 'null'
      description: Снимок параметров запуска; профиль, модель и версии фиксируются при создании. До succeeded
        point_count=0 и результаты не опубликованы. Допустимые переходы queued→running→succeeded|failed; внутренние
        повторы worker не создают новый run_id. history_end <= as_of <= forecast_start < forecast_end. Месяц/год
        прибавляются календарно с ограничением числом дней целевого месяца.
      allOf:
      - if:
          properties:
            status:
              const: succeeded
        then:
          properties:
            calculated_at:
              type: string
              format: date-time
            finished_at:
              type: string
              format: date-time
            started_at:
              type: string
              format: date-time
            failure:
              type: 'null'
      - if:
          properties:
            status:
              const: failed
        then:
          properties:
            calculated_at:
              type: 'null'
            finished_at:
              type: string
              format: date-time
            failure:
              $ref: '#/components/schemas/RunFailure'
      - if:
          properties:
            status:
              enum:
              - queued
              - running
        then:
          properties:
            calculated_at:
              type: 'null'
            finished_at:
              type: 'null'
            failure:
              type: 'null'
            point_count:
              const: 0
    ForecastRunPage:
      type: object
      additionalProperties: false
      required:
      - items
      - page
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ForecastRun'
        page:
          $ref: '#/components/schemas/Page'
    PredictionInterval:
