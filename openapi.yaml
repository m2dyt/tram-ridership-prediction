      - page
      properties:
        summary:
          $ref: '#/components/schemas/EvaluationSummary'
        items:
          type: array
          items:
            $ref: '#/components/schemas/EvaluationPoint'
        page:
          $ref: '#/components/schemas/Page'
    TripStop:
