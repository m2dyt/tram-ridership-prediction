  /forecast-runs/{run_id}/map:
    get:
      tags:
      - Forecasts
      operationId: getForecastMap
      summary: Прогноз одного интервала на карте
      description: 'GeoJSON для одного точного interval_start. interval_end определяется шагом профиля; нельзя
        запрашивать произвольную агрегацию. Те же run и фильтры дают те же значения, что /points. Недостающая
        геометрия сохраняется как null с флагом missing_geometry. Неподдерживаемый пространственный фильтр
        — 422; неготовый/ошибочный run — 409. Пустая выборка — FeatureCollection с features=[]. Все пространственные
        фильтры соединяются AND; неизвестный ID — 404, неверная принадлежность или сочетание — 422. Нельзя
        фильтровать остановку в агрегате уровня route. Валидная пустая выборка — 200 с features=[]; неизвестные
        query-параметры — 422. Сортировка точек: interval_start, route_id, direction_id (null первым), stop_sequence,
        stop_id, segment_id. Курсор привязан к версии и фильтрам; проход страниц не смешивает версии.'
      parameters:
      - $ref: '#/components/parameters/RunPath'
      - $ref: '#/components/parameters/IntervalStart'
      - $ref: '#/components/parameters/RouteId'
      - $ref: '#/components/parameters/DirectionId'
      - $ref: '#/components/parameters/StopId'
      - $ref: '#/components/parameters/StopSequence'
      - $ref: '#/components/parameters/SegmentId'
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Успешный ответ.
          headers:
            X-Request-ID:
              description: ID запроса для поиска в журнале.
              schema:
                type: string
          content:
            application/geo+json:
              schema:
                $ref: '#/components/schemas/ForecastMap'
              examples:
                demo:
                  $ref: '#/components/examples/ForecastMap'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'
  /evaluations:
