            regression:
              anyOf:
              - type: string
              - type: 'null'
        feature_availability_policy:
          type: string
        warnings:
          type: array
          items:
            type: string
    EvaluationPage:
      type: object
      additionalProperties: false
      required:
      - items
      - page
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/EvaluationSummary'
        page:
          $ref: '#/components/schemas/Page'
    EvaluationPoint:
